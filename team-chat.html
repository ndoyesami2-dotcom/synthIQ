<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SynthIQ — Team chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/synthiq-legal-footer.css" />
    <style>
      :root {
        --navy-950: #030712;
        --glass: rgba(22, 30, 58, 0.75);
        --stroke: rgba(129, 140, 248, 0.28);
        --text: #e8ecff;
        --muted: #94a3b8;
        --radius: 1rem;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: "Outfit", system-ui, sans-serif;
        color: var(--text);
        background: radial-gradient(ellipse 90% 70% at 50% -15%, rgba(99, 102, 241, 0.14), transparent 50%),
          var(--navy-950);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .hidden {
        display: none !important;
      }
      #gateErr {
        padding: 1.25rem;
        color: #fca5a5;
        font-weight: 600;
      }
      header.chat-head {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem 1.25rem;
        border-bottom: 1px solid var(--stroke);
        background: rgba(15, 23, 42, 0.92);
        backdrop-filter: blur(12px);
      }
      header.chat-head h1 {
        margin: 0;
        font-size: 1.05rem;
      }
      header.chat-head .sub {
        margin: 0.15rem 0 0;
        font-size: 0.72rem;
        color: var(--muted);
      }
      header.chat-head a {
        color: #a5b4fc;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.82rem;
      }
      #chatMain {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        max-width: 820px;
        width: 100%;
        margin: 0 auto;
        padding: 0 1rem 1rem;
      }
      #msgScroll {
        flex: 1;
        overflow-y: auto;
        padding: 1rem 0;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }
      .bubble-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        max-width: 85%;
      }
      .bubble-row.me {
        align-self: flex-end;
        align-items: flex-end;
      }
      .bubble-meta {
        font-size: 0.65rem;
        color: var(--muted);
        margin-bottom: 0.2rem;
      }
      .bubble {
        padding: 0.55rem 0.75rem;
        border-radius: 0.85rem;
        background: var(--glass);
        border: 1px solid rgba(129, 140, 248, 0.22);
        font-size: 0.88rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .bubble-row.me .bubble {
        background: linear-gradient(145deg, rgba(99, 102, 241, 0.42), rgba(139, 92, 246, 0.28));
        border-color: rgba(167, 139, 250, 0.35);
      }
      .composer {
        flex-shrink: 0;
        display: flex;
        gap: 0.5rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--stroke);
      }
      .composer input {
        flex: 1;
        padding: 0.6rem 0.75rem;
        border-radius: 0.65rem;
        border: 1px solid var(--stroke);
        background: rgba(8, 12, 28, 0.95);
        color: var(--text);
        font-family: inherit;
        font-size: 0.9rem;
      }
      .composer button {
        padding: 0.6rem 1rem;
        border-radius: 0.65rem;
        border: none;
        font-family: inherit;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #fff;
      }
      .composer button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .empty-hint {
        color: var(--muted);
        font-size: 0.85rem;
        text-align: center;
        padding: 2rem 1rem;
      }
    </style>
  </head>
  <body>
    <p id="gateErr" class="hidden"></p>
    <header class="chat-head hidden" id="chatHead">
      <div>
        <h1 id="chatTeamTitle">Team chat</h1>
        <p class="sub" id="chatTeamSub">—</p>
      </div>
      <a href="./team-room.html" id="backRoom">← Room</a>
    </header>
    <div id="chatMain" class="hidden">
      <div id="msgScroll" aria-live="polite"></div>
      <div class="composer">
        <input id="inpMsg" type="text" maxlength="2000" placeholder="Message everyone in this team…" autocomplete="off" />
        <button type="button" id="btnSend">Send</button>
      </div>
    </div>

    <script type="module">
      import { auth, authPersistenceReady, db, refreshIdTokenForFirestore } from "./signup/signup-firebase.js";
      import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
      import {
        doc,
        getDoc,
        collection,
        query,
        orderBy,
        limit,
        onSnapshot,
        addDoc,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

      let teamId = "";
      let myUid = "";
      let unsubMsgs = null;
      const rosterLabels = {};

      function normalizeTeamId(raw) {
        let t = String(raw || "").trim().toUpperCase().replace(/\s+/g, "");
        if (!t.startsWith("SYN-")) t = "SYN-" + t.replace(/^SYN-?/, "");
        return t;
      }

      function parseTeamIdFromUrl() {
        try {
          const p = new URLSearchParams(window.location.search);
          return normalizeTeamId(p.get("id") || p.get("team") || "");
        } catch (_) {
          return "";
        }
      }

      function showGate(msg) {
        document.getElementById("gateErr").textContent = msg;
        document.getElementById("gateErr").classList.remove("hidden");
        document.getElementById("chatHead").classList.add("hidden");
        document.getElementById("chatMain").classList.add("hidden");
      }

      function escapeHtml(s) {
        const d = document.createElement("div");
        d.textContent = s ?? "";
        return d.innerHTML;
      }

      function scrollMsgsBottom() {
        const el = document.getElementById("msgScroll");
        el.scrollTop = el.scrollHeight;
      }

      function renderMessages(docs) {
        const wrap = document.getElementById("msgScroll");
        wrap.innerHTML = "";
        if (!docs.length) {
          wrap.innerHTML = '<p class="empty-hint">No messages yet. Say hello 👋</p>';
          return;
        }
        docs.forEach(function (row) {
          const data = row.data;
          const uid = data.fromUid || "";
          const me = uid === myUid;
          const rowEl = document.createElement("div");
          rowEl.className = "bubble-row" + (me ? " me" : "");
          const meta = document.createElement("div");
          meta.className = "bubble-meta";
          const who = me ? "You" : rosterLabels[uid] || uid.slice(0, 6) + "…";
          let when = "";
          if (data.createdAt?.toMillis) when = new Date(data.createdAt.toMillis()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
          meta.textContent = who + (when ? " · " + when : "");
          const bubble = document.createElement("div");
          bubble.className = "bubble";
          bubble.innerHTML = escapeHtml(data.text || "");
          rowEl.appendChild(meta);
          rowEl.appendChild(bubble);
          wrap.appendChild(rowEl);
        });
        scrollMsgsBottom();
      }

      function subscribeMessages() {
        if (unsubMsgs) unsubMsgs();
        const coll = collection(db, "teams", teamId, "messages");
        const tryOrdered = query(coll, orderBy("createdAt", "asc"), limit(200));

        const paint = function (snap) {
          const docs = [];
          snap.forEach(function (d) {
            docs.push({ id: d.id, data: d.data() });
          });
          docs.sort(function (a, b) {
            const ta = a.data.createdAt?.toMillis?.() ?? 0;
            const tb = b.data.createdAt?.toMillis?.() ?? 0;
            return ta - tb;
          });
          renderMessages(docs);
        };

        unsubMsgs = onSnapshot(
          tryOrdered,
          paint,
          function () {
            unsubMsgs = onSnapshot(coll, paint, function () {
              document.getElementById("msgScroll").innerHTML =
                '<p class="empty-hint">Could not load messages.</p>';
            });
          }
        );
      }

      function subscribeRoster() {
        onSnapshot(collection(db, "teams", teamId, "roster"), function (snap) {
          snap.forEach(function (d) {
            rosterLabels[d.id] = d.data().label || d.id.slice(0, 8);
          });
        });
      }

      async function sendMessage() {
        const inp = document.getElementById("inpMsg");
        const text = inp.value.trim();
        if (!text || !teamId || !myUid) return;
        const btn = document.getElementById("btnSend");
        btn.disabled = true;
        try {
          await refreshIdTokenForFirestore(myUid);
          await addDoc(collection(db, "teams", teamId, "messages"), {
            fromUid: myUid,
            text: text,
            createdAt: serverTimestamp(),
          });
          inp.value = "";
        } catch (e) {
          alert(e.message || "Could not send.");
        }
        btn.disabled = false;
      }

      document.getElementById("btnSend").addEventListener("click", sendMessage);
      document.getElementById("inpMsg").addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      await authPersistenceReady;

      onAuthStateChanged(auth, async function (user) {
        if (!user) {
          window.location.replace("./signup/synthiq-signin.html");
          return;
        }
        myUid = user.uid;
        teamId = parseTeamIdFromUrl();
        if (!teamId || !/^SYN-[A-Z0-9-]+$/i.test(teamId)) {
          showGate("Missing team ID. Open chat from Team Room.");
          return;
        }

        document.getElementById("backRoom").href = "./team-room.html?id=" + encodeURIComponent(teamId);

        try {
          await refreshIdTokenForFirestore(myUid);
          const teamSnap = await getDoc(doc(db, "teams", teamId));
          if (!teamSnap.exists()) {
            showGate("Team not found.");
            return;
          }
          const mu = teamSnap.data().memberUids;
          if (!Array.isArray(mu) || mu.indexOf(myUid) === -1) {
            showGate("You are not a member of this team.");
            return;
          }

          document.getElementById("gateErr").classList.add("hidden");
          document.getElementById("chatHead").classList.remove("hidden");
          document.getElementById("chatMain").classList.remove("hidden");
          document.getElementById("chatTeamTitle").textContent = teamSnap.data().name || "Team chat";
          document.getElementById("chatTeamSub").textContent = teamId + " · Group chat";

          subscribeRoster();
          subscribeMessages();
        } catch (e) {
          console.warn(e);
          showGate(e.message || "Could not open chat.");
        }
      });
    </script>
    <footer class="synthiq-legal-footer" role="contentinfo">
      <a href="./terms-and-services.html">Terms and services</a>
    </footer>
  </body>
</html>
